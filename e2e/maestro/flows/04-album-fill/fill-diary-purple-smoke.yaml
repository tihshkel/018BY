appId: com.tihshkel.x018BY
env:
  E2E_OWNER_NAME: Дневник A5 E2E
  E2E_USER_NAME: Анкета A5 E2E
---
- runFlow:
    file: ../03-album-create/create-diary-purple.yaml
- tapOn:
    id: page-card-1
- extendedWaitUntil:
    visible:
      id: form-save
    timeout: 15000
- tapOn:
    text: 'Введите'
    optional: true
- inputText: ${E2E_OWNER_NAME}
- tapOn:
    id: form-save
- extendedWaitUntil:
    visible:
      text: 'Предпросмотр'
    timeout: 20000
- tapOn:
    id: page-card-5
- extendedWaitUntil:
    visible:
      id: form-save
    timeout: 15000
- tapOn:
    text: 'Введите'
    optional: true
- inputText: ${E2E_USER_NAME}
- tapOn:
    id: form-save
- extendedWaitUntil:
    visible:
      text: 'Предпросмотр'
    timeout: 20000
- tapOn:
    id: page-card-24
- extendedWaitUntil:
    visible:
      id: form-save
    timeout: 15000
- tapOn:
    text: 'Введите'
    optional: true
- inputText: Математика
- tapOn:
    id: form-save
- extendedWaitUntil:
    visible:
      text: 'Предпросмотр'
    timeout: 20000
- tapOn:
    id: album-export-button
- assertVisible:
    id: export-format-electronic
- tapOn:
    id: export-format-electronic
- tapOn:
    id: export-start
- extendedWaitUntil:
    visible:
      text: 'Электронная версия'
    timeout: 120000
- assertVisible:
    id: export-done-home
