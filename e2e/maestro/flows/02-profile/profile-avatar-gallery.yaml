    file: ../_helpers/go-to-profile.yaml
- addMedia:
    - ./e2e/fixtures/avatar-test.jpg
- tapOn:
    id: profile-avatar-button
- tapOn:
    id: avatar-gallery-pick
- tapOn:
    text: 'Choose'
