appId: com.tihshkel.x018BY
---
- runFlow:
    file: ../_helpers/guest-setup-to-home.yaml
- runFlow:
    file: ../_helpers/go-to-profile.yaml
- tapOn:
    id: profile-subscription-badge-button
- assertVisible:
    id: export-subscription-screen
- assertVisible:
    text: 'Экспорт для печати'
- assertVisible:
    text: 'Разовая покупка'
- assertVisible:
    text: 'Навсегда на этом Apple ID, без ежемесячных списаний.'
- scrollUntilVisible:
    element:
      id: print-unlock-restore
    direction: DOWN
- assertVisible:
    id: print-unlock-restore
- assertVisible:
    text: 'История покупок Apple ID'
- back
