appId: com.tihshkel.x018BY
env:
  E2E_SUPABASE_EMAIL: ${E2E_SUPABASE_EMAIL}
  E2E_SUPABASE_PASSWORD: ${E2E_SUPABASE_PASSWORD}
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-start
- tapOn:
    id: login-email
- inputText: ${E2E_SUPABASE_EMAIL}
- tapOn:
    id: login-password
- inputText: ${E2E_SUPABASE_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: home-greeting
    timeout: 30000
- runFlow:
    file: ../_helpers/go-to-profile.yaml
- tapOn:
    id: profile-edit-name
- tapOn:
    id: profile-name-input
- eraseText
- inputText: Sync E2E
- tapOn:
    id: profile-name-save
- assertVisible:
    text: 'Sync E2E'
