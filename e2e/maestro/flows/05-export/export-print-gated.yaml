# iOS only. Use an account with no print-unlock purchase (or reset Xcode test transactions).
# Clearing app data alone does not clear StoreKit ownership.
appId: com.tihshkel.x018BY
---
- runFlow:
    file: ../04-album-fill/fill-kids-page1.yaml
- tapOn:
    id: album-export-button
- tapOn:
    id: export-format-hard
- assertVisible:
    id: print-unlock-paywall
- assertVisible:
    id: print-unlock-purchase
- assertVisible:
    id: print-unlock-restore
- extendedWaitUntil:
    visible:
      id: print-unlock-later
      enabled: true
    timeout: 60000
- tapOn:
    id: print-unlock-later
- tapOn:
    id: export-format-soft
- assertVisible:
    id: print-unlock-paywall
- tapOn:
    id: print-unlock-later
- tapOn:
    id: export-format-electronic
- assertNotVisible:
    id: print-unlock-paywall
- tapOn:
    id: export-start
- extendedWaitUntil:
    visible:
      id: export-done-home
    timeout: 120000
- assertNotVisible:
    id: print-unlock-paywall
